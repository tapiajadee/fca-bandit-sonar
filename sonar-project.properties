# SonarQube / SonarCloud base settings

# ===================================================
# Configuración del Proyecto SonarQube
# ===================================================
# Identificador único del proyecto (debe coincidir con el Project Key creado en SonarQube)
# No se incluye `sonar.token` en el repo: el token se pasa por variable de entorno.
sonar.projectKey=vulnerable-api
# Nombre que se mostrará en la interfaz de SonarQube
sonar.projectName=Vulnerable-API
# Versión del proyecto (puedes cambiarla libremente)
sonar.projectVersion=1.0
# Directorio raíz del código fuente a analizar
# El punto (.) significa el directorio actual
sonar.sources=.
# URL del servidor de SonarQube
# - Para SonarQube local: http://localhost:9000
# - Para SonarCloud: https://sonarcloud.io
sonar.host.url=http://localhost:9000
# Organización en SonarCloud (requerido solo si se usa SonarCloud)
# Reemplaza "your-organization" con el key de tu organización en SonarCloud
sonar.organization=your-organization
# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Exclusiones — añadimos los reportes para que Sonar no los analice como código
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,**/.git/**,**/.venv/**,bandit-report.json,bandit-report.html
# Lenguaje del proyecto (Python en este caso)
sonar.language=py
# ===================================================
# Integración con Bandit (External Issues)
# ===================================================
sonar.python.bandit.reportPaths=bandit-report.json
